services:
  vcam:
    build: .
    image: vcam:latest
    # NTP clock adjustment: only enable in an isolated VM, or when changing the
    # native Linux host clock is explicitly intended.
    # cap_add:
    #   - SYS_TIME     # grants adjtimex / clock_settime on the visible kernel clock
    ports:
      - "8554:8554"
      # - "8555:8555"   # cameras with their own `port:` in cameras.yaml
      # UDP ports for RTP/RTCP when clients use UDP transport (e.g., GStreamer
      # Discoverer). Each camera instance uses 8 consecutive ports starting from
      # 8000 (see UDP_BLOCK_SIZE in src/vcam/mediamtx.py).
      - "8000-8007:8000-8007/udp"
    volumes:
      - ./cameras.yaml:/vcam/cameras.yaml:ro
      - ./videos:/vcam/videos:ro
    restart: unless-stopped
    # command: run --ntp-server 192.0.2.123

  # Optional TCP chaos testing proxy (Toxiproxy).
  # Run with: docker compose --profile chaos up -d
  # Creates a TCP proxy on :8654 forwarding to vcam:8554 and exposes HTTP API on :8474.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.11.0
    container_name: vcam-toxiproxy
    ports:
      - "8474:8474"   # Toxiproxy HTTP control API
      - "8654:8654"   # Impaired RTSP TCP proxy port
    depends_on:
      - vcam
    profiles: ["chaos"]

  # Unit tests:  docker compose --profile test run --rm test
  test:
    build:
      context: .
      target: test
    profiles: ["test"]
