name: Release

on:
  push:
    tags:
      - "v[0-9]*"   # e.g. v0.1.0, v1.2.3

permissions:
  contents: write   # create GitHub Release + attach assets

jobs:
  # ── 1. Run the test suite first ────────────────────────────────────────────
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]   # spot-check on release

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra prototype --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --extra prototype --python ${{ matrix.python-version }} pytest

  # ── 2. Build the wheel + sdist ─────────────────────────────────────────────
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build wheel and sdist
        run: uv build

      - name: Verify the wheel installs and the CLI is callable
        run: |
          pip install dist/*.whl --quiet
          vcam --version

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # ── 3. Build & push multi-arch Docker image to Docker Hub ─────────────────
  docker:
    name: Docker build & push (amd64 + arm64)
    runs-on: ubuntu-latest
    needs: test
    environment: dockerhub

    steps:
      - uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for arm64 cross-build)
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: konekuto/vcam
          tags: |
            # semver tag  →  konekuto/vcam:0.1.0
            type=semver,pattern={{version}}
            # major.minor →  konekuto/vcam:0.1
            type=semver,pattern={{major}}.{{minor}}
            # latest only on non-pre-release tags
            type=raw,value=latest,enable=${{ !contains(github.ref_name, 'a') && !contains(github.ref_name, 'b') && !contains(github.ref_name, 'rc') }}
          labels: |
            org.opencontainers.image.title=vcam
            org.opencontainers.image.description=Virtual RTSP camera CLI — serve looping video files as multiplexed RTSP feeds
            org.opencontainers.image.vendor=Konekuto
            org.opencontainers.image.licenses=MIT

      - name: Pin today's apt snapshot
        id: apt
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APT_SNAPSHOT=${{ steps.apt.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 4. Create the GitHub Release ───────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, docker]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history for the commit log fallback

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Compose release body
        id: body
        run: |
          python3 - <<'PYEOF'
          import os, re, subprocess, textwrap

          version = "${{ steps.version.outputs.version }}"

          # Try CHANGELOG first
          notes = ""
          try:
              text = open("CHANGELOG.md").read()
              pattern = rf"(?m)^## \[{re.escape(version)}\].*?\n(.*?)(?=\n^## \[|\Z)"
              m = re.search(pattern, text, re.DOTALL)
              if m:
                  notes = m.group(1).strip()
              else:
                  print(f"::warning::No CHANGELOG entry for {version}; using commit log")
          except FileNotFoundError:
              print("::warning::CHANGELOG.md not found; using commit log")

          # Fallback: git log
          if not notes:
              try:
                  prev = subprocess.check_output(
                      ["git", "describe", "--tags", "--abbrev=0", "HEAD^"],
                      stderr=subprocess.DEVNULL, text=True).strip()
                  log_range = f"{prev}..HEAD"
              except subprocess.CalledProcessError:
                  log_range = "HEAD"
              notes = subprocess.check_output(
                  ["git", "log", "--pretty=format:- %s", log_range], text=True).strip()

          lines = [
              f"## vcam {version}",
              "",
              notes,
              "",
              "---",
              "**Install via pip / uv**",
              "```bash",
              f"pipx install vcam=={version}   # standalone CLI",
              f"uv tool install vcam=={version}",
              "```",
              "",
              "**Docker**",
              "```bash",
              f"docker pull konekuto/vcam:{version}",
              "docker pull konekuto/vcam:latest  # amd64 + arm64",
              "```",
          ]
          body = "\n".join(lines)

          with open("release_body.md", "w") as f:
              f.write(body)
          PYEOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: vcam ${{ steps.version.outputs.version }}
          body_path: release_body.md
          files: |
            dist/*.whl
            dist/*.tar.gz
          draft: false
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
