name: CI

on:
  push:
    branches: ["main"]
  pull_request:

# Nothing here writes to the repository: the jobs check out, test, build and
# push to Docker Hub with its own credentials. Least privilege by default, in
# line with release.yml and stale.yml.
permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      # Style and typing are checked once, not per matrix entry: they do not
      # vary by OS or interpreter, and ruff pins the 3.10 target itself.
      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest

  # Push konekuto/vcam:main to Docker Hub on every merge to main.
  # Requires DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets.
  docker-push-main:
    name: Docker push (main)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, docker-build]
    environment: dockerhub

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU (for arm64 cross-build)
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Keeps the Docker Hub repo page (short description + rendered README)
      # in sync with the source, so the image is actually findable via
      # Docker Hub / web search instead of showing a blank overview page.
      - name: Sync Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: konekuto/vcam
          short-description: >-
            Virtual RTSP camera CLI/Docker image — loop video files as multiplexed
            RTSP streams for testing DeepStream and other video analytics pipelines.
          readme-filepath: ./README.md

      - name: Pin today's apt snapshot
        id: apt
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Build and push konekuto/vcam:main
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: konekuto/vcam:main
          build-args: |
            APT_SNAPSHOT=${{ steps.apt.outputs.date }}
          labels: |
            org.opencontainers.image.title=vcam
            org.opencontainers.image.description=Virtual RTSP camera CLI — serve looping video files as multiplexed RTSP feeds
            org.opencontainers.image.vendor=Konekuto
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-build:
    name: Docker build (amd64 smoke-test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Pin today's apt snapshot
        id: apt
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Build image (cache-only, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          pull: true
          load: true
          tags: vcam:ci
          build-args: |
            APT_SNAPSHOT=${{ steps.apt.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: docker run --rm vcam:ci --version

      # Fails only on vulnerabilities that have a fixed package available, so
      # unfixable base-image CVEs don't permanently block the pipeline.
      - name: Scan image for fixable CRITICAL/HIGH vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vcam:ci
          format: table
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
